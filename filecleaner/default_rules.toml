# ═══════════════════════════════════════════════════════════════════════
#  File Cleaner — что считать ненужным и куда раскладывать файлы.
#
#  Режимы:
#    delete — удалить сразу. Только то, что восстанавливается само
#             (кэши, временные файлы). Твои файлы так не удаляются.
#    review — перенести в папку «Ready for approval». Смотришь сам,
#             ненужное удаляется только после команды «утвердить».
#    report — только показать в отчёте, ничего не трогать.
#    off    — не искать.
#
#  Возраст файла сам по себе НЕ делает его ненужным: старые файлы
#  по умолчанию попадают только в отчёт.
#
#  Свою копию правил открывает команда:  filecleaner rules --edit
# ═══════════════════════════════════════════════════════════════════════

[ui]
language = "auto"          # язык программы: auto — как в Windows, ru — русский, en — English

[scan]
# Где искать: desktop, downloads, documents, pictures, music, videos или любые пути ("B:/Архив").
roots = ["desktop", "downloads", "documents", "pictures", "music", "videos"]
# Файлы, изменённые недавно, не трогаем: могут ещё качаться или редактироваться.
min_file_age_minutes = 30
# Папки-«свалки», куда всё падает само: здесь лишние копии и установщики ищутся смелее,
# а «Приступай» удаляет проверенные копии сразу. Имена (downloads, desktop) или пути ("B:/Загрузки").
dump_folders = ["downloads", "desktop"]

[protect]
# Эти папки и файлы программа не трогает совсем: не удаляет, не переносит на проверку и не раскладывает.
paths = []
# Файлы и папки с такими словами в имени тоже не трогаются совсем (например, "pw2" — учебная виртуалка).
keep_keywords = []
# Важные документы с такими словами в имени не удаляются и не уходят на проверку — только в отчёт.
# Раскладывать их по секторам можно: договор с работы уедет в «Работу».
name_keywords = [
    "паспорт", "passport", "pase", "виза", "договор", "contract", "līgums",
    "диплом", "diploma", "свидетельство", "certificate", "sertifikāts",
    "лицензия", "license", "licence", "wallet",
]

# ─── Системный мусор ────────────────────────────────────────────────────
[junk]
temp = "delete"           # временные файлы Windows старше temp_min_age_days
temp_min_age_days = 2
browser_cache = "delete"  # кэш браузеров (пароли, история и вкладки не затрагиваются)
app_cache = "delete"      # кэш Discord, VS Code, Slack, Steam
crash_dumps = "delete"    # дампы и отчёты о сбоях программ
dev_cache = "report"      # pip, npm… восстановится, но придётся качать заново
shader_cache = "off"      # кэш шейдеров видеокарты: игры будут подтормаживать, пока он не соберётся
recycle_bin = "report"    # содержимое Корзины Windows

# ─── Хлам среди твоих файлов ────────────────────────────────────────────
[files]
thumbs = "delete"             # Thumbs.db, .DS_Store — Windows создаст заново
office_locks = "review"       # ~$документ.docx и .tmp, оставшиеся после закрытия документов
partial_downloads = "review"  # .crdownload, .part — недокачанные файлы
partial_min_age_days = 7
empty_dirs = "delete"         # пустые папки в Загрузках и на Рабочем столе (отмена восстановит)
empty_dirs_min_age_days = 1

[duplicates]
min_size = "100KB"            # мелкие копии места не занимают — не ищем
same_folder = "review"        # копия лежит рядом с оригиналом
copy_names = "review"         # «файл (1).pdf», «файл — копия.docx»
in_downloads = "review"       # лишняя копия в Загрузках/на Рабочем столе, оригинал есть в другом месте
other = "report"              # копии в разных «осмысленных» папках — возможно, так задумано
folders = "review"            # одинаковые папки целиком («Проект» и «Проект (2)»)
min_folder_size = "10MB"

[archives]
extracted = "review"          # архив уже распакован в папку рядом (для .zip проверяется содержимое)

[installers]
installed = "review"          # установщик программы, которая уже установлена
old_versions = "review"       # есть более новая версия того же установщика
other = "report"              # остальные установщики — только в отчёт

[vm_disks]
unregistered = "review"       # диск VirtualBox (.vdi), не подключённый ни к одной виртуалке

[old_files]
mode = "report"               # старые большие файлы: возраст ≠ ненужность, решаешь сам
min_size = "500MB"
min_age_days = 365

# ─── Сортировка ─────────────────────────────────────────────────────────
[sort]
folders = ["downloads", "desktop"]  # что предлагать разобрать
by_year = false                     # раскладывать ещё и по годам: Документы/2024/…
move_folders = true                 # переносить подпапки целиком, если понятно куда
keep_folders = ["Telegram Desktop"] # папки, в которые пишут программы, — не трогать
unknown_to = ""                     # куда класть файлы неизвестных типов ("" — оставить на месте)

# Куда переносить типы целиком, например на другой диск:
# [sort.type_targets]
# "Образы дисков" = "B:/Архив/Образы дисков"
# "Видео" = "B:/Медиа/Видео"

# Секторы — папки по специализации. Файл попадает в сектор, если он скачан
# с одного из сайтов (sources), в имени есть ключевое слово (keywords)
# или его тип в списке types. Внутри сектора файлы раскладываются по типам.
# description — описание для локального ИИ: чем подробнее, тем точнее он раскладывает.
# target — переселить сектор в другое место (например на диск B:).

[[sector]]
name = "Учёба"
description = "учёба в университете (RTU), IT-направление: лекции, лабораторные и практические работы, домашние задания (assignments), курсовые, бакалаврская работа, программирование и ассемблер, базы данных, UML/BPMN/drawio-диаграммы"
sources = ["rtu.lv", "ortus.rtu.lv", "estudijas.rtu.lv"]
keywords = ["rtu", "ortus", "lab", "lecture", "lekcija", "homework", "uzdevums", "курсовая", "лабораторная", "лекция", "домашка"]

[[sector]]
name = "Работа"
description = "работа: автоматизация зданий (Siemens Desigo, ABT, BACnet, HVAC, АСУД), Daikin (DKN), проектная документация зданий на украинском: объекты АБ1 и АБ2, шкафы автоматики (ШАК), поэтажные чертежи; тренинги и учебные материалы Siemens"
sources = ["siemens.com", "siemens.cloud", "daikin.eu", "daikin.com"]
keywords = ["siemens", "desigo", "dcc", "abt", "daikin", "dkn", "bacnet", "hvac", "bms", "kyivstar", "асуд"]

[[sector]]
name = "Виртуалки"
description = "образы дисков и виртуальные машины"
types = ["Образы дисков"]
# target = "B:/Виртуалки"

# ─── Чтобы программы не потеряли перенесённые файлы ─────────────────────
[links]
update_office_recent = true        # поправить «Недавние документы» Word/Excel/PowerPoint
update_shortcuts = true            # поправить ярлыки и список недавних файлов Windows
keep_links_for_referenced = true   # если файл помнит другая программа — оставить ссылку на старом месте

# ─── Сжатие ─────────────────────────────────────────────────────────────
[compress]
algorithm = "LZX"         # LZX — сильнее всего; XPRESS4K/8K/16K — быстрее
min_saving = 0.15         # сжимать файл, только если он станет меньше хотя бы на 15%
skip_recent_days = 30     # недавно изменённые файлы не сжимаем: с ними ещё работают
include_vm_disks = false  # диски виртуалок — только если виртуалка не используется

# ─── «Приступай»: всё за один запуск, можно оставить на ночь ────────────
[night]
drives = true             # искать мусор и копии на всех встроенных дисках, а не только в папках из [scan] roots
                          # (на системном диске вне твоей папки пользователя — только отчёт)
auto_delete = true        # проверенные копии и распакованные zip в папках-свалках удалять сразу
                          # (перед удалением содержимое сверяется с оригиналом); остальное ждёт утра
sort_folders = ["downloads", "desktop", "documents"]  # что раскладывать; подпапки переносятся только в свалках
after = "nothing"         # когда закончит: nothing — ничего, sleep — сон, shutdown — выключить
ai_max_items = 2000       # сколько файлов за ночь показать локальной модели (ответы запоминаются)

# ─── Локальная ИИ-модель (Ollama) ───────────────────────────────────────
# Раскладывает по секторам файлы и папки, для которых не сработали правила выше.
# Работает на твоём компьютере: в интернет ничего не уходит. Нужен Ollama:
#   winget install Ollama.Ollama   и   ollama pull qwen2.5:7b
[ai]
enabled = false
url = "http://localhost:11434"
model = "qwen2.5:7b"
max_items = 500           # сколько файлов за один запуск показывать модели (ответы запоминаются)
min_confidence = 80       # насколько модель должна быть уверена (0–100), чтобы файл ушёл в сектор;
                          # qwen2.5:7b ставит 70, когда гадает, и 85–90, когда видит тему в имени или тексте
# Пара фраз о тебе — модель лучше поймёт, что к чему относится. Например:
# about = "Студент университета, работаю инженером; учебные материалы на английском и латышском"
about = ""
